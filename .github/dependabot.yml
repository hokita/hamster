version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /backend
      - /frontend
      - /e2e
      - /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directories:
      - /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      docker:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
